# Capsule OTA client configuration.
# Read by /usr/bin/capsula-ota on every start and every check.
# Safe to edit: unknown values are ignored by the shell.

ENABLED=1

# Restart Alice services after a successful update.
RESTART_SERVICES=1

# Restart services immediately after update. Launcher never unmutes or raises volume.
# Keep quiet hours only if you explicitly need to defer restarts.
DEFER_RESTART_AT_NIGHT=0
QUIET_START=23
QUIET_END=7

# Normal check interval and retry interval after a failed check (seconds).
OTA_INTERVAL=600
OTA_RETRY_INTERVAL=60

# Uncomment to override storage locations.
# OTA_HOME=/data/ota
# CAPSULA_OTA_BACKUP_HOME=/data/ota/backup

# Uncomment only if you host your own manifest and assets.
# CAPSULA_OTA_BASE_URL=https://example.com/ota
# CAPSULA_OTA_MANIFEST_URL=https://example.com/ota/manifest.txt
# CAPSULA_OTA_ASSET_PREFIX=https://example.com/ota/assets/
