[package]
name = "capsula-hub"
version = "0.2.10"
edition = "2021"
license = "MIT"
description = "Unified Rust web control panel and local services for Yandex Capsule Mini"

[lib]
name = "capsula_lib"
path = "src/lib.rs"

[[bin]]
name = "capsula-hub"
path = "src/main.rs"

[[bin]]
name = "capsula-yandex"
path = "src/bin/capsula-yandex.rs"

[[bin]]
name = "capsula-audio"
path = "src/bin/capsula-audio.rs"

[[bin]]
name = "capsula-alice"
path = "src/bin/capsula-alice.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
libc = "0.2"
pbkdf2 = "0.12"
rand = "0.8"
reqwest = { version = "0.12.4", default-features = false, features = ["json", "blocking", "rustls-tls", "stream"] }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "wav", "pcm", "ogg", "vorbis", "flac"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "net", "fs", "time", "signal", "io-util", "sync", "process"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
